name: Build & Release APK

# Build the extension APK and publish it as a GitHub Release asset when a
# version tag is pushed (e.g. `v0.1.0`). The Companion app installs from the
# release asset URL.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # create releases
  packages: read    # read karoo-ext from GitHub Packages via GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        env:
          # karoo-ext is on GitHub Packages; the automatic token can read it.
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "roadbook-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: extension/roadbook-*.apk
          generate_release_notes: true
