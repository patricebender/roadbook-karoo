name: Build & Release APK

# Auto-release the extension APK whenever the extension changes on main.
# Version is derived as vYYYY.MM.DD-<short-sha> (monotonic, no manual tagging).
# The Companion app installs from the release asset URL.
on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/release.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # create releases + tags
  packages: read    # read karoo-ext from GitHub Packages via GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compute version
        id: ver
        run: echo "version=v$(date +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: extension
        env:
          # karoo-ext is on GitHub Packages; the automatic token can read it.
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        working-directory: extension
        run: cp app/build/outputs/apk/debug/app-debug.apk "roadbook-${{ steps.ver.outputs.version }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: extension/roadbook-*.apk
          generate_release_notes: true
          make_latest: true
