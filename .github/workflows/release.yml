name: Release extension

# Semantic versioning via release-please (Conventional Commits).
#
# Flow: feat:/fix: commits on main -> release-please maintains a "Release PR"
# that bumps versionName in extension/app/build.gradle.kts + CHANGELOG. Merging
# that PR creates the tag `vX.Y.Z` + a GitHub Release, and this same
# run then builds the APK and attaches it to that release.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny-all by default; the release job opts into exactly what it needs below.
permissions: {}

# Serialize release runs so a fast follow-up push can't race the release PR.
concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # create releases + tags
      pull-requests: write   # maintain the release PR
      packages: read         # read karoo-ext from GitHub Packages via GITHUB_TOKEN
    steps:
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below only runs when a Release PR was just merged.
      - name: Checkout
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Bundle the POI seed (full Germany) into the APK. It's the same gzipped,
      # R*Tree-stripped file the region picker downloads, published on the regions
      # release — pulled here rather than rebuilt from OSM. Its schemaVersion must equal
      # the app's BUNDLED_DB_VERSION; a stale regions release (older schema) fails the
      # build so we never ship an APK whose seed the app would reject.
      - name: Fetch Germany seed asset
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p seed
          gh release download regions-latest --pattern 'manifest.json' --dir seed --clobber
          SCHEMA="$(jq -r '.schemaVersion' seed/manifest.json)"
          APP_VER="$(grep -oP 'BUNDLED_DB_VERSION\s*=\s*\K[0-9]+' \
            extension/app/src/main/kotlin/io/roadbook/karoo/data/PoiDatabase.kt)"
          echo "regions release schemaVersion=$SCHEMA, app BUNDLED_DB_VERSION=$APP_VER"
          if [[ "$SCHEMA" != "$APP_VER" ]]; then
            echo "::error::regions-latest is schema v$SCHEMA but the app expects v$APP_VER." \
              "Re-run the 'Build region files' workflow (all) to publish v$APP_VER, then release." >&2
            exit 1
          fi
          gh release download regions-latest \
            --pattern "germany-v${SCHEMA}.sqlite.gz" --dir seed --clobber
          cp "seed/germany-v${SCHEMA}.sqlite.gz" \
            extension/app/src/main/assets/pois-germany.sqlite.gz
          ls -la extension/app/src/main/assets/pois-germany.sqlite.gz

      - name: Build APK
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        working-directory: extension
        env:
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
          # Monotonic Android versionCode; versionName comes from release-please.
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Attach APK to release
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Manifest is path-scoped (package "extension"), so the tag output is
          # namespaced per path — the bare `tag_name` output is empty here.
          TAG: ${{ steps.rp.outputs['extension--tag_name'] }}
        run: |
          cp extension/app/build/outputs/apk/debug/app-debug.apk "roadbook-${TAG}.apk"
          gh release upload "$TAG" "roadbook-${TAG}.apk" --clobber
