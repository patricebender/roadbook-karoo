name: Release extension

# Semantic versioning via release-please (Conventional Commits).
#
# Flow: feat:/fix: commits on main -> release-please maintains a "Release PR"
# that bumps versionName in extension/app/build.gradle.kts + CHANGELOG. Merging
# that PR creates the tag `vX.Y.Z` + a GitHub Release, and this same
# run then builds the APK and attaches it to that release.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny-all by default; the release job opts into exactly what it needs below.
permissions: {}

# Serialize release runs so a fast follow-up push can't race the release PR.
concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # create releases + tags
      pull-requests: write   # maintain the release PR
      packages: read         # read karoo-ext from GitHub Packages via GITHUB_TOKEN
    steps:
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below only runs when a Release PR was just merged.
      - name: Checkout
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        working-directory: extension
        env:
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
          # Monotonic Android versionCode; versionName comes from release-please.
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Attach APK to release
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          cp extension/app/build/outputs/apk/debug/app-debug.apk "roadbook-${TAG}.apk"
          gh release upload "$TAG" "roadbook-${TAG}.apk" --clobber
