name: Deploy backend to Cloud Run

# Mirrors sharp6/.github/workflows/deploy.yml: build+push in the runner, keyless
# WIF auth, deploy to Cloud Run, in-workflow image cleanup. Path-filtered so it
# only runs when the backend (or this workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

env:
  PROJECT_ID: roadbook-karoo
  REGION: europe-west1
  SERVICE: roadbook-backend
  REGISTRY: europe-west1-docker.pkg.dev/roadbook-karoo/roadbook

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/1001293596927/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@roadbook-karoo.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        working-directory: backend
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          URL=$(gcloud run deploy ${{ env.SERVICE }} \
            --image "${{ env.REGISTRY }}/${{ env.SERVICE }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --service-account roadbook-runtime@roadbook-karoo.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 20 \
            --cpu 1 \
            --memory 256Mi \
            --timeout 30s \
            --cpu-throttling \
            --no-cpu-boost \
            --set-env-vars "NODE_ENV=production" \
            --format "value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: curl -fsS "${{ steps.deploy.outputs.url }}/health"

      # Keep only the 5 most recent SHA-tagged images to bound Artifact Registry
      # storage. Filter to 40-char hex tags so layer digests are ignored.
      - name: Clean up old images in Artifact Registry
        run: |
          gcloud artifacts docker images list \
            "${{ env.REGISTRY }}/${{ env.SERVICE }}" \
            --include-tags \
            --sort-by="~UPDATE_TIME" \
            --format="value(tags)" \
            | grep -E '^[0-9a-f]{40}$' \
            | tail -n +6 \
            | xargs -r -I{} gcloud artifacts docker images delete \
                "${{ env.REGISTRY }}/${{ env.SERVICE }}:{}" \
                --delete-tags \
                --quiet
